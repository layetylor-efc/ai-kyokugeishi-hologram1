<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>AI曲芸師｜Tilt Hologram v8.1</title><style>*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;background:radial-gradient(circle at 50% 0,#20326c,#07101e 48%,#030610);color:#fff;font-family:system-ui,sans-serif;text-align:center}.app{width:min(95vw,620px);margin:auto;padding:18px 12px 28px}h1{margin:0 0 6px;font-size:clamp(24px,5vw,34px)}.sub{margin:0 0 15px;opacity:.82}.stage{width:100%;perspective:950px;touch-action:pan-y}.tilt{position:relative;aspect-ratio:1;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform}.card{position:absolute;inset:0;border-radius:50%;overflow:hidden;clip-path:circle(49.8%);background:#fff;box-shadow:0 25px 55px #0008}.card img,#fx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}#fx{pointer-events:none}.controls{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}button{border:0;border-radius:999px;padding:13px 20px;font-size:16px;font-weight:800}#enable{background:linear-gradient(135deg,#65f5ff,#8d7dff,#ff72d5)}#reset{background:#ffffff18;color:#fff;border:1px solid #ffffff28}#status{font-size:13px;opacity:.75;margin-top:12px}.metrics{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}.metrics span{background:#ffffff12;border:1px solid #ffffff18;border-radius:10px;padding:7px 10px;font-size:12px}@media(min-width:700px){.app{width:min(82vw,560px)}}@media(min-width:900px) and (orientation:landscape){.app{width:min(56vw,540px)}}</style></head><body><main class="app"><h1>AI曲芸師｜Tilt Hologram v8.1</h1><p class="sub">スマホ／タブレットを傾けると、光・虹・ラメがリアルタイムに動きます。</p><section class="stage" id="stage"><div class="tilt"><div class="card" id="card"><img id="art" alt="AI曲芸師"><canvas id="fx"></canvas></div></div></section><div class="controls"><button id="enable">モーションセンサーを許可</button><button id="reset">中央に戻す</button></div><div id="status">画像を読み込み中…</div><div class="metrics"><span>描画 CANVAS 1</span><span id="src">入力 POINTER</span><span id="xy">傾き 0 / 0</span></div></main><script>(()=>{'use strict';const root=document.documentElement,stage=document.getElementById('stage'),card=document.getElementById('card'),art=document.getElementById('art'),cv=document.getElementById('fx'),ctx=cv.getContext('2d'),status=document.getElementById('status'),src=document.getElementById('src'),xy=document.getElementById('xy'),enable=document.getElementById('enable');fetch('./art.b64?v=2',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(b=>{art.src='data:image/jpeg;base64,'+b.trim();status.textContent='画像読み込み完了。センサーまたは指で動かせます。'}).catch(e=>{status.textContent='画像読み込みエラー: '+e.message});let tx=0,ty=0,x=0,y=0,pointer=false,sensor=false,dpr=1,w=1,h=1;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);w=Math.max(1,card.clientWidth|0);h=Math.max(1,card.clientHeight|0);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(card);addEventListener('resize',resize,{passive:true});resize();function point(e){const r=stage.getBoundingClientRect();tx=clamp(((e.clientX-r.left)/r.width-.5)*2,-1,1);ty=clamp(((e.clientY-r.top)/r.height-.5)*2,-1,1);pointer=true;src.textContent='入力 POINTER'}stage.addEventListener('pointerdown',e=>{stage.setPointerCapture?.(e.pointerId);point(e)});stage.addEventListener('pointermove',e=>{if(pointer||e.pointerType==='mouse')point(e)},{passive:true});stage.addEventListener('pointerup',()=>pointer=false);stage.addEventListener('pointercancel',()=>pointer=false);function orient(e){if(typeof e.gamma!=='number'||typeof e.beta!=='number')return;sensor=true;if(!pointer){tx=clamp(e.gamma/16,-1,1);ty=clamp((e.beta-35)/21,-1,1);src.textContent='入力 SENSOR';xy.textContent='傾き '+e.gamma.toFixed(1)+' / '+e.beta.toFixed(1)}}async function start(){try{if(typeof DeviceOrientationEvent==='undefined')throw Error('センサー非対応');if(typeof DeviceOrientationEvent.requestPermission==='function'){if(await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('許可されませんでした')}removeEventListener('deviceorientation',orient,true);addEventListener('deviceorientation',orient,true);enable.textContent='センサーON';status.textContent='センサー待機中。端末を少し傾けてください。'}catch(e){status.textContent=e.message+'。指操作は利用できます。'}}enable.onclick=start;document.getElementById('reset').onclick=()=>{tx=ty=x=y=0};const stars=Array.from({length:72},(_,i)=>({x:(Math.sin(i*91.7)*.5+.5),y:(Math.sin(i*47.3+2)*.5+.5),p:i*.77,s:.7+(i%5)*.35}));function draw(t){ctx.clearRect(0,0,w,h);const lx=w*(.5+x*.5),ly=h*(.5+y*.5),E=Math.min(1.2,Math.hypot(x,y));ctx.globalCompositeOperation='lighter';let g=ctx.createRadialGradient(lx,ly,0,lx,ly,Math.max(w,h)*.55);g.addColorStop(0,'rgba(255,255,255,.58)');g.addColorStop(.16,'rgba(80,245,255,.34)');g.addColorStop(.34,'rgba(90,120,255,.25)');g.addColorStop(.50,'rgba(255,80,220,.23)');g.addColorStop(.66,'rgba(255,230,80,.18)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(lx,ly);ctx.rotate(-.7);const bw=Math.max(w,h)*1.5,bh=Math.max(18,w*(.05+E*.025));g=ctx.createLinearGradient(-bw/2,0,bw/2,0);g.addColorStop(.35,'rgba(255,255,255,0)');g.addColorStop(.49,'rgba(255,255,255,.12)');g.addColorStop(.5,'rgba(255,255,255,.82)');g.addColorStop(.52,'rgba(120,245,255,.25)');g.addColorStop(.65,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(-bw/2,-bh/2,bw,bh);ctx.restore();for(const s of stars){const sx=s.x*w,sy=s.y*h,d=Math.hypot(sx-lx,sy-ly)/Math.hypot(w,h),a=clamp((.34-d)*4,0,1)*(.65+.35*Math.sin(t*.003+s.p));if(a<.06)continue;ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(sx,sy,s.s*(1+a*1.7),0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation='source-over';ctx.beginPath();ctx.arc(w/2,h/2,Math.min(w,h)*.485,0,Math.PI*2);ctx.lineWidth=Math.max(2,w*.01);ctx.strokeStyle=`rgba(130,240,255,${.13+E*.13})`;ctx.stroke()}function frame(t){x+=(tx-x)*.14;y+=(ty-y)*.14;root.style.setProperty('--rx',(-y*15).toFixed(1)+'deg');root.style.setProperty('--ry',(x*17).toFixed(1)+'deg');draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
