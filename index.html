<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>AI曲芸師｜Tilt Hologram v8.6</title><style>*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;background:radial-gradient(circle at 50% 0,#20326c,#07101e 48%,#030610);color:#fff;font-family:system-ui,sans-serif;text-align:center}.app{width:min(95vw,620px);margin:auto;padding:18px 12px 92px}h1{margin:0 0 6px;font-size:clamp(24px,5vw,34px)}.sub{margin:0 0 12px;opacity:.82}.controls{display:flex;justify-content:center;gap:9px;margin:0 0 14px;flex-wrap:wrap}.controls button{border:0;border-radius:999px;padding:12px 17px;font-size:15px;font-weight:800;transition:.18s ease;min-width:120px}.sensor-btn{background:#ffffff18;color:#fff;border:1px solid #ffffff28}.sensor-btn.active{background:linear-gradient(135deg,#65f5ff,#8d7dff,#ff72d5);color:#07101e;box-shadow:0 8px 22px #0005;transform:translateY(-1px)}.sensor-btn.pending{background:#ffd966;color:#201a00;border-color:#ffeaa5}#reset{background:#ffffff18;color:#fff;border:1px solid #ffffff28;min-width:auto}.stage{width:100%;perspective:950px;touch-action:pan-y}.tilt{position:relative;aspect-ratio:1;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform}.card{position:absolute;inset:0;border-radius:50%;overflow:hidden;clip-path:circle(49.8%);background:#fff;box-shadow:0 25px 55px #0008}.card img,#fx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}#fx{pointer-events:none}#status{font-size:13px;opacity:.82;margin-top:12px;min-height:1.4em}.metrics{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}.metrics span{background:#ffffff12;border:1px solid #ffffff18;border-radius:10px;padding:7px 10px;font-size:12px}.support-card{margin:22px auto 0;padding:18px;border-radius:22px;background:#ffffff0d;border:1px solid #ffffff20}.support-card h2{font-size:20px;margin:0 0 7px}.support-card p{margin:0 0 14px;font-size:14px;line-height:1.6;opacity:.86}.support-link{display:inline-flex;text-decoration:none;color:#07101e;background:linear-gradient(135deg,#ffe66d,#ff9edb,#76f4ff);border-radius:999px;padding:13px 20px;font-weight:800}.floating-support{position:fixed;right:14px;bottom:14px;z-index:20;text-decoration:none;color:#07101e;background:linear-gradient(135deg,#ffe66d,#ff9edb,#76f4ff);border-radius:999px;padding:12px 17px;font-weight:900;box-shadow:0 12px 28px #0008}@media(min-width:700px){.app{width:min(82vw,560px)}}@media(min-width:900px) and (orientation:landscape){.app{width:min(56vw,540px)}}</style></head><body><main class="app"><h1>AI曲芸師｜Tilt Hologram v8.6</h1><p class="sub">スマホ／タブレットを傾けると、光・虹・ラメがリアルタイムに動きます。</p><div class="controls"><button id="sensorOn" class="sensor-btn pending">センサー確認中</button><button id="sensorOff" class="sensor-btn">センサーOFF</button><button id="reset">中央に戻す</button></div><section class="stage" id="stage"><div class="tilt"><div class="card" id="card"><img id="art" src="./art.jpg?v=86" alt="AI曲芸師"><canvas id="fx"></canvas></div></div></section><div id="status">センサーONを自動で試しています…</div><div class="metrics"><span>描画 CANVAS 1</span><span id="src">入力 CHECK</span><span id="xy">傾き -- / --</span></div><section class="support-card"><h2>🎪 AI曲芸師を応援する</h2><p>この作品を気に入っていただけたら、開発・改良の応援をしてもらえるとうれしいです。</p><a class="support-link" id="supportLink" href="#">💖 投げ銭で応援する</a><p id="supportNote" style="font-size:12px;opacity:.62;margin-top:10px">支援ページ準備中です。</p></section></main><a class="floating-support" id="floatingSupport" href="#">💖 応援</a><script>(()=>{'use strict';const supportNote=document.getElementById('supportNote');[document.getElementById('supportLink'),document.getElementById('floatingSupport')].forEach(a=>a.onclick=e=>{e.preventDefault();supportNote.textContent='支援ページを準備中です。'});const root=document.documentElement,stage=document.getElementById('stage'),card=document.getElementById('card'),art=document.getElementById('art'),cv=document.getElementById('fx'),ctx=cv.getContext('2d'),status=document.getElementById('status'),src=document.getElementById('src'),xy=document.getElementById('xy'),sensorOn=document.getElementById('sensorOn'),sensorOff=document.getElementById('sensorOff');let sensorState='pending',sensorListening=false,sensorRequested=true,lastSensorAt=0,tx=0,ty=0,x=0,y=0,pointer=false,dpr=1,w=1,h=1;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function renderSensorState(){sensorOn.classList.remove('active','pending');sensorOff.classList.remove('active');if(sensorState==='on'){sensorOn.classList.add('active');sensorOn.textContent='✓ センサーON';sensorOff.textContent='センサーOFF';src.textContent='入力 SENSOR'}else if(sensorState==='off'){sensorOff.classList.add('active');sensorOn.textContent='センサーON';sensorOff.textContent='✓ センサーOFF';src.textContent='入力 POINTER'}else if(sensorState==='permission'){sensorOn.classList.add('pending');sensorOn.textContent='センサーを許可';sensorOff.textContent='センサーOFF';src.textContent='入力 WAIT'}else{sensorOn.classList.add('pending');sensorOn.textContent='センサー確認中';sensorOff.textContent='センサーOFF';src.textContent='入力 CHECK'}}art.onload=()=>{if(sensorState==='on')status.textContent='画像読み込み完了。センサーONです。端末を傾けてください。'};art.onerror=()=>status.textContent='画像読み込みエラー。ページを再読み込みしてください。';function resize(){dpr=Math.min(devicePixelRatio||1,2);w=Math.max(1,card.clientWidth|0);h=Math.max(1,card.clientHeight|0);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(card);addEventListener('resize',resize,{passive:true});resize();function point(e){const r=stage.getBoundingClientRect();tx=clamp(((e.clientX-r.left)/r.width-.5)*2,-1,1);ty=clamp(((e.clientY-r.top)/r.height-.5)*2,-1,1);pointer=true;src.textContent='入力 POINTER'}stage.addEventListener('pointerdown',e=>{stage.setPointerCapture?.(e.pointerId);point(e)});stage.addEventListener('pointermove',e=>{if(pointer||e.pointerType==='mouse')point(e)},{passive:true});stage.addEventListener('pointerup',()=>pointer=false);stage.addEventListener('pointercancel',()=>pointer=false);function orient(e){if(!sensorRequested||typeof e.gamma!=='number'||typeof e.beta!=='number')return;lastSensorAt=performance.now();if(sensorState!=='on'){sensorState='on';renderSensorState();status.textContent='センサーON。端末を傾けてください。'}if(!pointer){tx=clamp(e.gamma/16,-1,1);ty=clamp((e.beta-35)/21,-1,1);src.textContent='入力 SENSOR';xy.textContent='傾き '+e.gamma.toFixed(1)+' / '+e.beta.toFixed(1)}}async function enableSensor(userGesture=false){sensorRequested=true;sensorState='pending';renderSensorState();try{if(typeof DeviceOrientationEvent==='undefined'){sensorState='off';renderSensorState();throw Error('センサー非対応')}if(typeof DeviceOrientationEvent.requestPermission==='function'){if(!userGesture){sensorState='permission';renderSensorState();status.textContent='センサーを使うには「センサーを許可」を押してください。';return}const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted'){sensorState='off';renderSensorState();throw Error('許可されませんでした')}}if(!sensorListening){addEventListener('deviceorientation',orient,true);sensorListening=true}status.textContent='センサーを確認中。端末を少し傾けてください。';setTimeout(()=>{if(sensorRequested&&sensorState==='pending'&&performance.now()-lastSensorAt>1200){status.textContent='センサー信号待ちです。端末を少し傾けてください。'}},1300)}catch(e){status.textContent=e.message+'。指操作は利用できます。'}}function disableSensor(){sensorRequested=false;sensorState='off';renderSensorState();tx=ty=0;xy.textContent='傾き OFF';status.textContent='センサーOFF。指でなぞると光が動きます。'}sensorOn.onclick=()=>enableSensor(true);sensorOff.onclick=disableSensor;document.getElementById('reset').onclick=()=>{tx=ty=x=y=0};renderSensorState();enableSensor(false);const stars=Array.from({length:72},(_,i)=>({x:Math.sin(i*91.7)*.5+.5,y:Math.sin(i*47.3+2)*.5+.5,p:i*.77,s:.7+(i%5)*.35}));function draw(t){ctx.clearRect(0,0,w,h);const lx=w*(.5+x*.5),ly=h*(.5+y*.5),E=Math.min(1.2,Math.hypot(x,y));ctx.globalCompositeOperation='lighter';let g=ctx.createRadialGradient(lx,ly,0,lx,ly,Math.max(w,h)*.55);g.addColorStop(0,'rgba(255,255,255,.58)');g.addColorStop(.16,'rgba(80,245,255,.34)');g.addColorStop(.34,'rgba(90,120,255,.25)');g.addColorStop(.5,'rgba(255,80,220,.23)');g.addColorStop(.66,'rgba(255,230,80,.18)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(lx,ly);ctx.rotate(-.7);const bw=Math.max(w,h)*1.5,bh=Math.max(18,w*(.05+E*.025));g=ctx.createLinearGradient(-bw/2,0,bw/2,0);g.addColorStop(.35,'rgba(255,255,255,0)');g.addColorStop(.49,'rgba(255,255,255,.12)');g.addColorStop(.5,'rgba(255,255,255,.82)');g.addColorStop(.52,'rgba(120,245,255,.25)');g.addColorStop(.65,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(-bw/2,-bh/2,bw,bh);ctx.restore();for(const s of stars){const sx=s.x*w,sy=s.y*h,d=Math.hypot(sx-lx,sy-ly)/Math.hypot(w,h),a=clamp((.34-d)*4,0,1)*(.65+.35*Math.sin(t*.003+s.p));if(a<.06)continue;ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(sx,sy,s.s*(1+a*1.7),0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation='source-over';ctx.beginPath();ctx.arc(w/2,h/2,Math.min(w,h)*.485,0,Math.PI*2);ctx.lineWidth=Math.max(2,w*.01);ctx.strokeStyle=`rgba(130,240,255,${.13+E*.13})`;ctx.stroke()}function frame(t){x+=(tx-x)*.14;y+=(ty-y)*.14;root.style.setProperty('--rx',(-y*15).toFixed(1)+'deg');root.style.setProperty('--ry',(x*17).toFixed(1)+'deg');draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
